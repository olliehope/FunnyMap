name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, validate, and package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Run headless tests
        run: ./gradlew --stacktrace test

      - name: Validate production room database
        run: ./gradlew --stacktrace validateRoomDatabase

      - name: Build development jar
        run: ./gradlew --stacktrace build -PbuildMode=development -PbuildCommit=${GITHUB_SHA::7}

      - name: Verify packaged release resources
        run: ./gradlew --stacktrace verifyReleaseResources -PbuildMode=development -PbuildCommit=${GITHUB_SHA::7}

      - name: Verify build did not rewrite tracked files
        run: git diff --exit-code

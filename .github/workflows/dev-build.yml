name: Development Build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build development artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Read build identity
        id: identity
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "base_version=$(sed -n 's/^version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Test, validate, and build
        run: >-
          ./gradlew --stacktrace clean test validateRoomDatabase build
          verifyReleaseResources printBuildMetadata
          -PbuildMode=development
          -PbuildCommit=${{ steps.identity.outputs.short_sha }}

      - name: Stage snapshot artifact
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          source_jar="build/libs/funnymap-${{ steps.identity.outputs.base_version }}-dev+${{ steps.identity.outputs.short_sha }}.jar"
          target_jar="dist/FunnyMap-${{ steps.identity.outputs.base_version }}-dev+${{ steps.identity.outputs.short_sha }}.jar"
          test -f "$source_jar"
          cp "$source_jar" "$target_jar"
          echo "path=$target_jar" >> "$GITHUB_OUTPUT"

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "## FunnyMap development build"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Minecraft: \`$(sed -n 's/^minecraft_version=//p' gradle.properties)\`"
            echo "- Artifact: \`FunnyMap-${{ steps.identity.outputs.base_version }}-dev+${{ steps.identity.outputs.short_sha }}.jar\`"
            echo
            echo '```text'
            ./gradlew -q validateRoomDatabase -PbuildMode=development -PbuildCommit=${{ steps.identity.outputs.short_sha }}
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload development artifact
        uses: actions/upload-artifact@v7
        with:
          name: FunnyMap-${{ steps.identity.outputs.base_version }}-dev+${{ steps.identity.outputs.short_sha }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 14

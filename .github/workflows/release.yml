name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Validate tag and branch
        id: identity
        shell: bash
        run: |
          base_version=$(sed -n 's/^version=//p' gradle.properties)
          tag_version=${GITHUB_REF_NAME#v}
          test "$tag_version" = "$base_version" || {
            echo "Tag $GITHUB_REF_NAME does not match Gradle version $base_version" >&2
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit on main" >&2
            exit 1
          }
          echo "version=$base_version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Test, validate, and build release jar
        run: >-
          ./gradlew --stacktrace clean test validateRoomDatabase build
          verifyReleaseResources printBuildMetadata
          -PbuildMode=release
          -PbuildCommit=${{ steps.identity.outputs.short_sha }}

      - name: Stage jar and checksum
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          source_jar="build/libs/funnymap-${{ steps.identity.outputs.version }}.jar"
          release_jar="FunnyMap-${{ steps.identity.outputs.version }}.jar"
          test -f "$source_jar"
          cp "$source_jar" "dist/$release_jar"
          (cd dist && sha256sum "$release_jar" > "$release_jar.sha256")
          echo "jar=dist/$release_jar" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$release_jar.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${{ steps.artifact.outputs.jar }}"
          "${{ steps.artifact.outputs.checksum }}"
          --verify-tag
          --title "FunnyMap ${{ steps.identity.outputs.version }}"
          --generate-notes

name: Feature request
description: Propose a focused improvement that respects the client-data boundary.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the user or contributor problem rather than only the proposed implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: client-data
    attributes:
      label: Client-visible evidence
      description: Explain which normal client data would support the feature and how unavailable data remains unknown.

  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This request does not require packet spoofing, force-loading, hidden server state, automation, gameplay assistance, or anti-cheat bypasses.
          required: true

import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.4.20"
}

def baseVersion = project.version.toString()
def requestedBuildMode = (findProperty("buildMode") ?: System.getenv("FUNNYMAP_BUILD_MODE") ?: "development")
	.toString().trim().toLowerCase(Locale.ROOT)
if (!(requestedBuildMode in ["development", "release"])) {
	throw new GradleException("buildMode must be 'development' or 'release'")
}
def requestedCommit = (findProperty("buildCommit") ?: System.getenv("FUNNYMAP_BUILD_COMMIT") ?: "local")
	.toString().trim().replaceAll("[^0-9A-Za-z.-]", "")
if (requestedCommit.isEmpty()) requestedCommit = "local"
def buildVersion = requestedBuildMode == "release"
	? baseVersion
	: "${baseVersion}-dev+${requestedCommit}"
version = buildVersion
def targetMinecraftVersion = project.minecraft_version.toString()

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"funnymap" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	testImplementation platform("org.junit:junit-bom:6.1.3")
	testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:2.4.20"
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def buildProperties = [
		version: project.version,
		base_version: baseVersion,
		build_mode: requestedBuildMode,
		build_commit: requestedCommit,
		minecraft_version: targetMinecraftVersion,
	]
	inputs.properties buildProperties

	filesMatching(["fabric.mod.json", "assets/funnymap/build-info.properties"]) {
		expand buildProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_25
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	manifest {
		attributes(
			"Implementation-Title": "FunnyMap",
			"Implementation-Version": project.version,
			"FunnyMap-Build-Mode": requestedBuildMode,
			"FunnyMap-Commit": requestedCommit,
		)
	}
}

def productionRoomDatabase = layout.projectDirectory.file("src/main/resources/assets/funnymap/rooms.json")

tasks.register("validateRoomDatabase", JavaExec) {
	group = "verification"
	description = "Validates the bundled production room database with the runtime loader."
	dependsOn classes
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.andyy.funnymap.tools.RoomDatabaseValidatorCli"
	args productionRoomDatabase.asFile.absolutePath
}

tasks.register("verifyReleaseResources", JavaExec) {
	group = "verification"
	description = "Checks distributable jar identity and rejects raw, report, or synthetic resources."
	dependsOn jar
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "com.andyy.funnymap.tools.ReleaseArtifactVerifierCli"
	args tasks.jar.archiveFile.get().asFile.absolutePath, requestedBuildMode
}

tasks.register("printBuildMetadata") {
	group = "help"
	description = "Prints build identity used by CI and development artifacts."
	inputs.properties([
		buildVersion: buildVersion,
		baseVersion: baseVersion,
		buildMode: requestedBuildMode,
		buildCommit: requestedCommit,
		minecraftVersion: targetMinecraftVersion,
	])
	doLast {
		println "BUILD_VERSION=${buildVersion}"
		println "BUILD_BASE_VERSION=${baseVersion}"
		println "BUILD_MODE=${requestedBuildMode}"
		println "BUILD_COMMIT=${requestedCommit}"
		println "MINECRAFT_VERSION=${targetMinecraftVersion}"
	}
}

check {
	dependsOn validateRoomDatabase
	dependsOn verifyReleaseResources
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
